# Cloud Build -> Cloud Run (ai-tools-484419). Trigger fires on push to main.
#
# Trigger substitutions (set in the Cloud Build trigger, never in git):
#   _GOOGLE_CLIENT_ID / _GOOGLE_CLIENT_SECRET   Google OAuth
#   _FLASK_SECRET_KEY                           session signing key (stable across deploys)
#   _DATABASE_URL       postgresql+psycopg://britestack:PASS@/britestack?host=/cloudsql/britecreations:us-central1:brite-shadow-db
#   _CLOUDSQL_INSTANCE  britecreations:us-central1:brite-shadow-db
#   _VITE_FIREBASE_*    legacy Firebase build args

options:
  logging: CLOUD_LOGGING_ONLY
  # Missing substitutions become empty strings instead of failing the build
  substitution_option: ALLOW_LOOSE

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg=VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - '--build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg=VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}'
      - '--build-arg=VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg=VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg=VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/brite-stack:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/brite-stack:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'brite-stack'
      - '--image'
      - 'gcr.io/$PROJECT_ID/brite-stack:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}'
      - '--set-env-vars=^@@^GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}@@GOOGLE_CLIENT_SECRET=${_GOOGLE_CLIENT_SECRET}@@FLASK_SECRET_KEY=${_FLASK_SECRET_KEY}@@DATABASE_URL=${_DATABASE_URL}@@BQ_JOB_PROJECT=$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/brite-stack:latest'

timeout: '1200s'
